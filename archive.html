const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock() {
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.textContent = 'Decrypting…';
  try {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(BLOB.salt), iterations:BLOB.iter, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(BLOB.nonce)}, key, b64(BLOB.ct));
    document.getElementById('content').innerHTML = new TextDecoder().decode(pt);
    document.getElementById('gate').style.display = 'none';
  } catch(e) { err.textContent = 'Wrong password.'; }
}
document.getElementById('unlock').addEventListener('click', unlock);
document.getElementById('pw').addEventListener('keydown', e => { if(e.key==='Enter') unlock(); });
